<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="Homepage for Last Light Academy.">
        <title>Last Light | Contact</title>

        <link rel="icon" href="assets/images/favicon.png"> 

        

        <!-- Cinzel Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="assets/css/contact.css">
    </head>

    <body>
        <div class="backgroundOverlay"></div>
        <div class="navBar">

            <div class="navLeft">
                <a href="houses.html"><img src="assets/images/duskwinterBanner.png" alt="house duskwinter banner"></a>
                <a href="houses.html"><img src="assets/images/graymorrowBanner.png" alt="house graymorrow banner"></a>
            </div>

            <div class="navNormLinks">
                <a href="index.html" data-i18n="nav.home"></a>
                <p>|</p>
                <a href="articles.html" data-i18n="nav.articles"></a>
                <p>|</p>
                <a href="events.html" data-i18n="nav.events"></a>
                <p>|</p>
                <a href="club.html" data-i18n="nav.clubs"></a>
                <p>|</p>
                <a href="contact.html" data-i18n="nav.contact"></a>
                <p>|</p>
                <a href="staff.html" data-i18n="nav.staff"></a>
            </div>

            <div class="navRight">
                <a href="houses.html"><img src="assets/images/gloomtailBanner.png" alt="house gloomtail banner"></a>
                <a href="houses.html"><img src="assets/images/woolwinBanner.png" alt="house woolwin banner"></a>
            </div>
            
        </div>

        <!-- Contact form -->
        <div class="mainContent">
            <div class="contactCard">

                <h1 data-i18n="contact.title"></h1>

                <p class="contactSubtitle" data-i18n="contact.subtitle"></p>

                <form action="404.html" novalidate>

                    <label for="name" data-i18n="contact.name"></label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        data-i18n-placeholder="contact.placeholder.name"
                        required>

                    <label for="email" data-i18n="contact.email"></label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        data-i18n-placeholder="contact.placeholder.email"
                        required>

                    <label for="subject" data-i18n="contact.subject"></label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        data-i18n-placeholder="contact.placeholder.subject">

                    <label for="message" data-i18n="contact.message"></label>
                    <textarea
                        id="message"
                        name="message"
                        data-i18n-placeholder="contact.placeholder.message"
                        required></textarea>

                    <input
                        type="submit"
                        data-i18n-value="contact.submit">

                </form>

            </div>
        </div>

        <div class="languageSwitcher">

            <button id="lang-en" class="langButton" aria-label="English">
                <img src="assets/images/flags/en_us.png" alt="United States flag">
            </button>

            <button id="lang-es" class="langButton" aria-label="Español">
                <img src="assets/images/flags/es_es.png" alt="Spanish flag">
            </button>

        </div>

        <script src="assets/js/i18n.js"></script>
    </body>

</html>
