<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta name="description" content="Homepage for Last Light Academy.">
        <title>Last Light | Events</title>

        <link rel="icon" href="assets/images/favicon.png"> 

        

        <!-- Cinzel Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="assets/css/events.css">
    </head>

    <body>
        <div class="backgroundOverlay"></div>
        <div class="navBar">

            <div class="navLeft">
                <a href="houses.html"><img src="assets/images/duskwinterBanner.png" alt="house duskwinter banner"></a>
                <a href="houses.html"><img src="assets/images/graymorrowBanner.png" alt="house graymorrow banner"></a>
            </div>

            <div class="navNormLinks">
                <a href="index.html" data-i18n="nav.home"></a>
                <p>|</p>
                <a href="articles.html" data-i18n="nav.articles"></a>
                <p>|</p>
                <a href="events.html" data-i18n="nav.events"></a>
                <p>|</p>
                <a href="club.html" data-i18n="nav.clubs"></a>
                <p>|</p>
                <a href="contact.html" data-i18n="nav.contact"></a>
                <p>|</p>
                <a href="staff.html" data-i18n="nav.staff"></a>
            </div>

            <div class="navRight">
                <a href="houses.html"><img src="assets/images/gloomtailBanner.png" alt="house gloomtail banner"></a>
                <a href="houses.html"><img src="assets/images/woolwinBanner.png" alt="house woolwin banner"></a>
            </div>
            
        </div>

        <!-- TIMELINE -->
        <!-- TIMELINE -->
        <div class="newsSection">

            <h1 data-i18n="events.newsTitle"></h1>

            <video class="newsVideo" controls poster="assets/images/newsThumbnail.jpeg">
                <source src="assets/videos/weeklyNews.mp4" type="video/mp4">
                <span data-i18n="events.videoFallback"></span>
            </video>

            <p class="newsCaption" data-i18n="events.newsCaption"></p>

        </div>

        <section class="timelineSection">

            <h2 data-i18n="events.upcoming"></h2>

            <div class="timeline">

                <div class="timelineEvent">

                    <div class="timelineDot"></div>

                    <div class="timelineContent">

                        <img
                            data-i18n-src="events.orientation.image" 
                            src="assets/images/orientation_en.png"
                            alt="New student orientation image">

                        <h3 data-i18n="events.orientation.title"></h3>

                        <p data-i18n="events.orientation.date"></p>

                        <p data-i18n="events.orientation.description"></p>

                    </div>

                </div>

                <!-- Add future events here -->

            </div>

        </section>

        <div class="languageSwitcher">

            <button id="lang-en" class="langButton" aria-label="English">
                <img src="assets/images/flags/en_us.png" alt="United States flag">
            </button>

            <button id="lang-es" class="langButton" aria-label="Español">
                <img src="assets/images/flags/es_es.png" alt="Spanish flag">
            </button>

        </div>

        <script src="assets/js/i18n.js"></script>

    </body>

</html>
